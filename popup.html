<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Smooth Scroll</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon.svg" alt="">
        <h1>Twitch Smooth Scroll</h1>
      </header>

      <section>
        <label class="row" for="enabled">
          <span>Aktiv</span>
          <span class="switch">
            <input id="enabled" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>

        <label class="row" for="speed">
          <span>Tempo</span>
          <select id="speed">
            <option value="0.65">Sanft</option>
            <option value="1">Normal</option>
            <option value="1.5">Schnell</option>
            <option value="2">Sehr schnell</option>
          </select>
        </label>
      </section>

      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
