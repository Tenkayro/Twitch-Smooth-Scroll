<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Smooth Scroll</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon.svg" alt="">
        <h1 data-i18n="extensionName">Twitch Smooth Scroll</h1>
      </header>

      <section>
        <label class="row" for="enabled">
          <span data-i18n="active">Active</span>
          <span class="switch">
            <input id="enabled" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>

        <label class="row" for="speed">
          <span data-i18n="speed">Speed</span>
          <select id="speed">
            <option value="0.65" data-i18n="speedGentle">Gentle</option>
            <option value="1" data-i18n="speedNormal">Normal</option>
            <option value="1.5" data-i18n="speedFast">Fast</option>
            <option value="2" data-i18n="speedVeryFast">Very fast</option>
          </select>
        </label>

        <label class="row" for="language">
          <span data-i18n="language">Language</span>
          <select id="language"></select>
        </label>
      </section>

      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
